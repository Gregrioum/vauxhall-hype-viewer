<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vauxhall HYPE — Vision GT 3D Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./assets/index-BIW2gGQA.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CWUtjPAf.css">
  </head>
  <body data-studio="dark">
    <div id="canvas-container"></div>

    <!-- Loading Overlay -->
    <div id="loader" class="loader">
      <div class="loader-inner">
        <div class="loader-brand">VAUXHALL · VISION GT</div>
        <div class="loader-title">HYPE</div>
        <div class="loader-bar-track">
          <div id="loader-bar" class="loader-bar-fill"></div>
        </div>
        <div id="loader-status" class="loader-status">Initializing studio…</div>
      </div>
    </div>

    <!-- Top Header -->
    <header class="hud-top">
      <div class="brand-block">
        <div class="brand-kicker">VAUXHALL VISION GT</div>
        <h1 class="brand-title">HYPE <span class="brand-sub">ACTIVE AERO STUDIO</span></h1>
        <div class="camera-readout" id="camera-readout">
          <span class="dot" id="mode-dot"></span>
          <span id="lens-label">80mm</span>
          <span class="sep">·</span>
          <span id="mode-label">Auto Orbit</span>
        </div>
      </div>

      <div class="camera-presets" role="group" aria-label="Camera Presets">
        <button class="preset-btn active" data-preset="front34">Front 3/4</button>
        <button class="preset-btn" data-preset="side">Side</button>
        <button class="preset-btn" data-preset="rear34">Rear 3/4</button>
        <button class="preset-btn" data-preset="top">Top</button>
      </div>
    </header>

    <!-- Subtle Hint -->
    <div class="interaction-hint" id="interaction-hint">
      Drag to orbit (switches to 50mm free view) · Scroll to zoom
    </div>

    <!-- Bottom Control Dock -->
    <nav class="hud-dock" aria-label="Viewer Controls">
      <!-- Studio Switcher -->
      <div class="dock-group studio-group" role="group" aria-label="Studio Lighting">
        <button id="btn-studio-dark" class="seg-btn active" title="Dark Studio (Cycles 4-Ribbon Rig)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <span>Dark</span>
        </button>
        <button id="btn-studio-white" class="seg-btn" title="White Studio (Cycles High-Key Rig)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
          <span>Light</span>
        </button>
      </div>

      <div class="dock-divider"></div>

      <!-- Shape Key Aero Animation Controls -->
      <div class="dock-group aero-group">
        <button id="btn-aero-toggle" class="ctrl-btn primary" title="Open or Close Active Aero Flaps">
          <svg id="icon-aero" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3" />
          </svg>
          <span id="label-aero">Open Aero Flaps</span>
        </button>

        <button id="btn-aero-loop" class="ctrl-btn" title="Continuously Loop Aero Flaps">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="17 1 21 5 17 9" />
            <path d="M3 11V9a4 4 0 0 1 4-4h14" />
            <polyline points="7 23 3 19 7 15" />
            <path d="M21 13v2a4 4 0 0 1-4 4H3" />
          </svg>
          <span>Loop</span>
        </button>

        <div class="scrubber-wrap" title="Scrub Active Aero Flaps (0–100%)">
          <input
            id="aero-scrubber"
            type="range"
            min="0"
            max="100"
            step="0.5"
            value="0"
            aria-label="Aero flaps position"
          />
          <span id="aero-pct" class="aero-pct">0%</span>
        </div>
      </div>

      <div class="dock-divider"></div>

      <!-- Auto-Rotate / Free Browse Camera Control -->
      <div class="dock-group cam-group">
        <button id="btn-orbit-toggle" class="ctrl-btn active" title="Toggle Auto-Rotate (80mm) vs Free Browse (50mm)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2v6h-6" />
            <path d="M2.5 22v-6h6" />
            <path d="M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8" />
            <path d="M22 12.5a10 10 0 0 1-18.8 4.2L2.5 16" />
          </svg>
          <span id="label-orbit">Auto-Rotate · 80mm</span>
        </button>

        <button id="btn-ui-minimize" class="ctrl-btn icon-only" title="Minimize Controls (H)" aria-label="Minimize Controls">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>
      </div>
    </nav>

    <!-- Minimized Floating Restore Pill -->
    <button id="btn-ui-restore" class="hud-restore-pill" title="Show Controls (H)" aria-label="Show Controls">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="18 15 12 9 6 15" />
      </svg>
      <span>Controls</span>
    </button>

  </body>
</html>
